<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEMA-архив · Поиск по семинару</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:#202d28;font:17px/1.55 system-ui}main{max-width:850px;margin:auto;padding:40px 20px}header{border-top:4px solid #245746;padding-top:18px;color:#315c4b;letter-spacing:.12em}h1{font:clamp(32px,6vw,54px)/1.1 Georgia}input[type=search]{width:100%;padding:14px;border:1px solid #76887f;border-radius:8px;font:inherit}article{padding:18px 0;border-bottom:1px solid #cad0c4}h2{font:24px Georgia;margin:0}a{color:#185842}small,summary{color:#46594d}details{margin-top:32px}</style>

<script>

};
const el=id=>document.getElementById(id);
function render(){
 el('title').textContent=record.title;
 const words=el('q').value.toLocaleLowerCase('ru').trim().split(/\s+/);
 const chapters=record.chapters.filter(c=>words.every(w=>(c.title+' '+c.summary).toLocaleLowerCase('ru').includes(w)));
 el('hits').replaceChildren();el('count').textContent=chapters.length?'Найдено глав: '+chapters.length:'Совпадений нет. Попробуйте сократить запрос.';
 for(const c of chapters){const row=document.createElement('article'),heading=document.createElement('h2'),desc=document.createElement('p'),link=document.createElement('a');
 heading.textContent=c.title;desc.textContent=c.summary;const t=Math.floor(c.start);link.href='https://www.youtube.com/watch?v='+record.youtube+'&t='+t+'s';link.textContent='▶ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+' · Смотреть с этого момента';row.append(heading,desc,link);el('hits').append(row);}
}
el('q').oninput=render;
el('file').onchange=async e=>{try{const r=JSON.parse(await e.target.files[0].text());if(r.version!==1||typeof r.title!=='string'||!/^[A-Za-z0-9_-]{11}$/.test(r.youtube)||!Array.isArray(r.chapters)||!r.chapters.length||!r.chapters.every(c=>Number.isFinite(c.start)&&c.start>=0&&typeof c.title==='string'&&typeof c.summary==='string'))throw Error();record=r;el('q').value='';render();el('msg').textContent='Черновик открыт.';}catch{el('msg').textContent='Проверьте формат по примеру JSON.'}};render();</script></html>
